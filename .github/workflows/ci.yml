name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  select_checks:
    name: Select PR checks
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gitleaks: ${{ steps.select.outputs.gitleaks }}
    steps:
      - name: Select required checks
        id: select
        # Secret scanning is required for every PR, including documentation changes.
        run: echo "gitleaks=true" >> "$GITHUB_OUTPUT"

  gitleaks:
    name: Gitleaks
    needs: select_checks
    # Pushes run independently of the PR-only selection job.
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' ||
      (needs.select_checks.result == 'success' &&
      needs.select_checks.outputs.gitleaks == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_VERSION: '8.30.1'

  pr_result:
    name: PR checks
    needs: [select_checks, gitleaks]
    if: always() && github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify selected checks
        env:
          SELECTION_RESULT: ${{ needs.select_checks.result }}
          GITLEAKS_SELECTED: ${{ needs.select_checks.outputs.gitleaks }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
        run: |
          if [ "$SELECTION_RESULT" != "success" ]; then
            echo "Check selection did not succeed."
            exit 1
          fi

          case "$GITLEAKS_SELECTED" in
            true)
              if [ "$GITLEAKS_RESULT" != "success" ]; then
                echo "Required Gitleaks check did not succeed: $GITLEAKS_RESULT"
                exit 1
              fi
              ;;
            false)
              echo "Gitleaks was not selected for this run."
              ;;
            *)
              echo "Invalid Gitleaks selection."
              exit 1
              ;;
          esac
