name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  select_checks:
    name: Select PR checks
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gitleaks: ${{ steps.select.outputs.gitleaks }}
      php_tests: ${{ steps.select.outputs.php_tests }}
    steps:
      - name: Select required checks
        id: select
        # Secret scanning is required for every PR, including documentation changes.
        run: |
          echo "gitleaks=true" >> "$GITHUB_OUTPUT"
          echo "php_tests=true" >> "$GITHUB_OUTPUT"

  gitleaks:
    name: Gitleaks
    needs: select_checks
    # Pushes run independently of the PR-only selection job.
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' ||
      (needs.select_checks.result == 'success' &&
      needs.select_checks.outputs.gitleaks == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_VERSION: '8.30.1'

  php_tests:
    name: PHP tests and XSD validation
    needs: select_checks
    if: needs.select_checks.outputs.php_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, simplexml
          coverage: none
          tools: none

      - name: Download XML schemas
        run: |
          mkdir -p .tmp/schemas/3.2
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            https://rudnerbjoern.github.io/iTop-schema/extension.xsd \
            --output .tmp/schemas/extension.xsd
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            https://rudnerbjoern.github.io/iTop-schema/3.2/itop_design.xsd \
            --output .tmp/schemas/3.2/itop_design.xsd

      - name: Run PHP tests and schema validation
        run: php tests/run.php

  pr_result:
    name: PR checks
    needs: [select_checks, gitleaks, php_tests]
    if: always() && github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify selected checks
        env:
          SELECTION_RESULT: ${{ needs.select_checks.result }}
          GITLEAKS_SELECTED: ${{ needs.select_checks.outputs.gitleaks }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          PHP_TESTS_SELECTED: ${{ needs.select_checks.outputs.php_tests }}
          PHP_TESTS_RESULT: ${{ needs.php_tests.result }}
        run: |
          if [ "$SELECTION_RESULT" != "success" ]; then
            echo "Check selection did not succeed."
            exit 1
          fi

          for check in GITLEAKS PHP_TESTS; do
            selected="${check}_SELECTED"
            result="${check}_RESULT"
            case "${!selected}" in
              true)
                if [ "${!result}" != "success" ]; then
                  echo "Required $check check did not succeed: ${!result}"
                  exit 1
                fi
                ;;
              false)
                echo "$check was not selected for this run."
                ;;
              *)
                echo "Invalid $check selection."
                exit 1
                ;;
            esac
          done
